<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel Puerta Giratoria - Plátanos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            background-color: #0f2e14; /* Verde oscuro elegante */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Título arriba */
        .titulo-carrusel {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            color: #ffcc00;
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Escenario 3D */
        .escenario-3d {
            perspective: 1200px;
            width: 260px;
            height: 360px; /* Formato vertical */
            margin-top: 50px;
        }

        .carrusel-puerta {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Las tarjetas de las fotos */
        .cara-carrusel {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            background-color: #ffffff;
            border: 6px solid #ffffff; /* Marco blanco */
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        /* Posicionamiento 3D para 3 imágenes */
        .cara-carrusel:nth-child(1) { transform: rotateY(0deg) translateZ(250px); }
        .cara-carrusel:nth-child(2) { transform: rotateY(120deg) translateZ(250px); }
        .cara-carrusel:nth-child(3) { transform: rotateY(240deg) translateZ(250px); }

        /* ESTO ES CLAVE: Cómo se muestran las imágenes */
        .cara-carrusel img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Rellena todo el marco sin deformarse */
            display: block;
        }

        /* Ajuste para celulares */
        @media (max-width: 600px) {
            .titulo-carrusel { font-size: 1.5rem; top: 20px; }
            .escenario-3d { width: 220px; height: 300px; margin-top: 60px; }
            .cara-carrusel:nth-child(1) { transform: rotateY(0deg) translateZ(210px); }
            .cara-carrusel:nth-child(2) { transform: rotateY(120deg) translateZ(210px); }
            .cara-carrusel:nth-child(3) { transform: rotateY(240deg) translateZ(210px); }
        }
    </style>
</head>
<body>

    <!-- Título Grande -->
    <div class="titulo-carrusel">
        Mientras más tickets,<br>más oportunidades tienes de ganar.
    </div>

    <!-- Carrusel -->
    <div class="escenario-3d">
        <div class="carrusel-puerta" id="miCarrusel">
            <div class="cara-carrusel"><img src="1.jpg" alt="Imagen 1"></div>
            <div class="cara-carrusel"><img src="2.jpg" alt="Imagen 2"></div>
            <div class="cara-carrusel"><img src="3.jpg" alt="Imagen 3"></div>
        </div>
    </div>

    <script>
        let anguloActual = 0;
        const carrusel = document.getElementById('miCarrusel');
        
        // Gira cada 7 segundos
        setInterval(() => {
            anguloActual -= 120; 
            carrusel.style.transform = `rotateY(${anguloActual}deg)`;
        }, 7000); 
    </script>

</body>
</html>
