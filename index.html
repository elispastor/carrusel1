<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel Puerta Giratoria 3D - Premium</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f2e14; /* Verde oscuro elegante de fondo */
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        /* Contenedor con perspectiva */
        .escenario-3d {
            perspective: 1200px;
            width: 340px;
            height: 340px;
        }

        .carrusel-puerta {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Tarjetas de las imágenes */
        .cara-carrusel {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            
            /* Fondo blanco para que las imágenes que no son cuadradas no se vean cortadas */
            background-color: #ffffff; 
            
            /* Borde elegante y sombra profunda */
            border: 4px solid #e0e0e0;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            
            /* TRUCO CLAVE: Padding interno para que la imagen no toque los bordes */
            padding: 15px;
            box-sizing: border-box;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Posicionamiento 3D */
        .cara-carrusel:nth-child(1) { transform: rotateY(0deg) translateZ(280px); }
        .cara-carrusel:nth-child(2) { transform: rotateY(120deg) translateZ(280px); }
        .cara-carrusel:nth-child(3) { transform: rotateY(240deg) translateZ(280px); }

        /* ESTILO DE LAS IMÁGENES */
        .cara-carrusel img {
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            
            /* 'contain' hace que la imagen se vea COMPLETA, sin recortarse */
            object-fit: contain; 
            
            border-radius: 10px;
            display: block;
        }

        /* Brillo sutil en los bordes (opcional) */
        .cara-carrusel::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            pointer-events: none;
        }

        /* Ajuste para pantallas de celular */
        @media (max-width: 600px) {
            .escenario-3d { width: 280px; height: 280px; }
            .cara-carrusel:nth-child(1) { transform: rotateY(0deg) translateZ(220px); }
            .cara-carrusel:nth-child(2) { transform: rotateY(120deg) translateZ(220px); }
            .cara-carrusel:nth-child(3) { transform: rotateY(240deg) translateZ(220px); }
        }
    </style>
</head>
<body>

    <div class="escenario-3d">
        <div class="carrusel-puerta" id="miCarrusel">
            <!-- Tu círculo (o primera imagen) -->
            <div class="cara-carrusel"><img src="1.jpg" alt="Imagen 1"></div>
            <!-- Las otras dos imágenes que tenían textos pegados -->
            <div class="cara-carrusel"><img src="2.jpg" alt="Imagen 2"></div>
            <div class="cara-carrusel"><img src="3.jpg" alt="Imagen 3"></div>
        </div>
    </div>

    <script>
        let anguloActual = 0;
        const carrusel = document.getElementById('miCarrusel');
        const anguloPorGiro = 120; 

        setInterval(() => {
            anguloActual -= anguloPorGiro; 
            carrusel.style.transform = `rotateY(${anguloActual}deg)`;
        }, 7000); 
    </script>

</body>
</html>
